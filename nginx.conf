# Serves the prebuilt VitePress site under /docs/. Everything nginx writes lives
# in /tmp, so the container runs with a read-only root filesystem as UID 101.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # Validators come from the files on disk, not from the HTML after the Slope
    # tag is injected, so they would call a page unchanged across a key change.
    etag off;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # Vite's hashed assets never change. Everything else revalidates, keyed on
    # the URI only: a 304 carries no Content-Type, so a type-based rule would
    # hand revalidated HTML a long max-age.
    map $uri $cache_control {
        ~^/docs/assets/ "public, max-age=31536000, immutable";
        /healthz        "no-store";
        default         "no-cache";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        # Behind the gateway the Host and port differ, so redirects stay relative.
        absolute_redirect off;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        error_page 404 /docs/404.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /docs {
            return 301 /docs/;
        }

        location /docs/ {
            # Slope Analytics script tag, rendered by docker-entrypoint.sh;
            # empty when SLOPE_PROJECT_KEY is unset.
            include /tmp/nginx/slope.conf;
            # Pages are built as *.html (links use them); the bare variant works too.
            try_files $uri $uri.html $uri/index.html =404;
        }

        location / {
            return 404;
        }
    }
}
